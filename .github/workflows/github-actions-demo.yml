name: Build and Deploy Code

on:
  push:
    branches:
      - "main"

permissions:
  contents: read
  id-token: write

jobs:
  job1:
    environment:
      name: test_env
      
    env:
      DATABASE_USER: ${{secrets.DATABASE_USER}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_HOST: ${{secrets.DATABASE_HOST}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
      GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
      MAIL_API_KEY: ${{secrets.MAIL_API_KEY}}
      FRONTEND_URL: ${{secrets.FRONTEND_URL}}
      VITE_API_BASE_URL: http://localhost/api/
      
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7
      
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: install dependencies
        working-directory: ./backend
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: run tests
        working-directory: ./backend
        shell: bash
        run: |
          python -m pytest

      - name: config node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: build frontend
        working-directory: ./frontend
        shell: bash
        run: |
          pwd
          npm install
          npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_SECRET_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
            
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: latest
      
      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          push: true
          set: |
            backend.tags=${{ secrets.DOCKER_USER_NAME }}/xala-backend:latest
            srvr.tags=${{ secrets.DOCKER_USER_NAME }}/xala-frontend:latest
            
  deploy:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials for  region audience
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
         role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
         aws-region: ap-southeast-1
         

      - name: Deploy to AWS
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Xala application" \
            --parameters 'commands=["cd /home/ashen/xala",
                                    "sudo su ashen",
                                    "docker-compose -f docker-compose-production.yml pull",
                                    "docker-compose -f docker-compose-production.yml up -d",
                                    "docker system prune"]' \


